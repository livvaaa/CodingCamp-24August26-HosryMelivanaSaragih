<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>To-Do Dashboard</h1>
    <button id="theme-toggle">🌙 Dark Mode</button>
    <section id="greeting-section">
    <h2 id="greeting-message">Hello!</h2>
    <div id="name-form">
    <input
        type="text"
        id="name-input"
        placeholder="Enter your name"
    >
    <button id="save-name-button">Save Name</button>
</div>
    <p id="current-date"></p>
    <p id="current-time"></p>
</section>
<section id="focus-timer">
    <h2>Focus Timer</h2>
    <div id="timer-display">25:00</div>

    <div id="timer-controls">
        <button id="start-timer">Start</button>
        <button id="stop-timer">Stop</button>
        <button id="reset-timer">Reset</button>
    </div>
    <div id="timer-duration">
    <label for="duration-select">Timer Duration:</label>

    <select id="duration-select">
        <option value="15">15 minutes</option>
        <option value="25" selected>25 minutes</option>
        <option value="45">45 minutes</option>
    </select>
</div>
</section>
    <main id="dashboard">
        <section id="input-section">
            <input type="text" id="task-input" placeholder="What do you need to do?">
    <button id="add-button">Add Task</button>
    <p id="validation-message"></p>
    </section>
<section id="filter-controls">
    <button data-filter="all">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="completed">Completed</button>
</section>
<section id="quick-links">
    <h2>Quick Links</h2>

    <div id="quick-link-form">
        <input
            type="text"
            id="link-name"
            placeholder="Website name"
        >

        <input
            type="url"
            id="link-url"
            placeholder="https://www.google.com"
        >

        <button id="add-link-button">Add Link</button>
    </div>

    <div id="quick-link-list"></div>
</section>
</main>
<section id="task-section">
    <h2>My Tasks</h2>
    <ul id="task-list"></ul>
</section>
<section id="statistics-panel">
    <div class="stat-card">
        <span>Total Tasks</span>
        <strong id="total-tasks">0</strong>
    </div>

    <div class="stat-card">
        <span>Active Tasks</span>
        <strong id="active-tasks">0</strong>
    </div>

    <div class="stat-card">
        <span>Completed Tasks</span>
        <strong id="completed-tasks">0</strong>
    </div>
</section>
<script src="js/script.js"></script>
</body>
</html>
